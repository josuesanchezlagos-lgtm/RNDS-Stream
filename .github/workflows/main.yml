name: Build NDS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: apt-get update && apt-get install -y ruby rake bison build-essential git
      - run: git config --global url."https://github.com".insteadOf "gh:"
      - run: git clone --depth 1 --branch 4.0.0 gh:mruby/mruby.git vendor/RubyNDS/vendor/mruby
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: RNDS-Stream-SD
          path: "**/*.nds"
          
